name: Import site source

on:
  push:
    paths:
      - 'joao-victor-web-codigo-fonte.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract site source
        shell: bash
        run: |
          set -euo pipefail
          test -f joao-victor-web-codigo-fonte.zip
          rm -rf .site-import
          mkdir .site-import
          unzip -q joao-victor-web-codigo-fonte.zip -d .site-import
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.vinext/' \
            --exclude '.env' \
            --exclude '.env.*' \
            .site-import/ ./
          rm -rf .site-import joao-victor-web-codigo-fonte.zip
          if ! grep -qxF '/.vinext/' .gitignore 2>/dev/null; then
            printf '\n# generated vinext assets\n/.vinext/\n' >> .gitignore
          fi

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import João Victor Web source'
          git push
